
backend:
  replicaCount: 1
  image:
    repository: k8s-microservice-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001

frontend:
  replicaCount: 1
  image:
    repository: k8s-microservice-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 5000
    nodePort: 30081

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: "8"
    pullPolicy: IfNotPresent
  service:
    port: 27017
