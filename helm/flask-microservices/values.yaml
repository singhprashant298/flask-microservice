
backend:
  replicaCount: 1
  image:
    repository: flask-backend
    tag: ci
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001

frontend:
  replicaCount: 1
  image:
    repository: flask-frontend
    tag: ci
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 5000
    nodePort: 30082

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: "8"
    pullPolicy: IfNotPresent
  service:
    port: 27017

